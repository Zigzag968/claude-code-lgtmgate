# .claude/backlog.yml -- backlog plugin config, contract 1 (opt-in, write-supervised mode: agent may
# apply GitHub-label writes for proposals already accepted by triage-check).
contract: 1
mode: write-supervised
# v1 refactor (2026-09-30, decision by the maintainer): scripted promotion to exec:agent is allowed
# for issues already triaged in the plan; the triage-check still validates every proposal.
promotion: checked
# The Lead (an interactive Claude session) is an agent executor too: adding exec:agent is a plain
# triage label (maintainer, 2026-09-30); status:ready still runs the deterministic check.
exec_gating: triage
repo: Zigzag968/claude-code-lgtmgate
labels:
  type: [bug, feature, tech-debt, docs, epic]
  status: [inbox, needs-info, ready]
  priority: ["0", "1", "2"]
  exec: [agent, human]
  size: [S, M, L]
  area: []
label_colors:
  type: "1d76db"
  status: "5319e7"
  priority: "d93f0b"
  exec: "0e8a16"
  size: "fbca04"
roles:
  intake: inbox
  waiting: needs-info
  ready: ready
  epic: epic
  bug: bug
  split: [L]
  candidate_sizes: [S, M]
  agent: [agent]
  human: [human]
executor_flags: [nightly]
exclusions: [cross-repo]
protected: [nightly, cross-repo, "auto:*"]
# priority ranks WORKSTREAMS, not a sequence and not a WIP queue (maintainer, 2026-09-30): the
# robustness milestone is the only "0" workstream, everything in it is priority:0; less urgent work
# is 1 or 2 and is not picked while a 0 workstream exists. Caps are a sanity ceiling only.
caps:
  "priority:0": 40
  "priority:1": 40
legacy_map:
  bug: "type:bug"
  enhancement: "type:feature"
  documentation: "type:docs"
  P0: "priority:0"
  P1: "priority:1"
  P2: "priority:2"
  interactive: "exec:human"
legacy_keep: [bug, enhancement, documentation, P0, P1, P2, interactive]
