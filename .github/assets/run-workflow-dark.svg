<svg viewBox="0 0 960 580" width="960" height="580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One lgtmgate run. You launch /lgtmgate:deliver with an issue and a brief; the Lead creates one worktree for the run. Theo diagnoses, Sam plans, Nick writes the code and opens the pull request, Morgan reviews it. Here Morgan asks for changes once, the work goes back to Nick and comes back to Morgan, who passes it. Mia (product framing) and a plan audit are optional. A refuted diagnosis, a dead dev run or a review that stops making progress ends the run. After the LGTM, the Lead merges only once you give your go-ahead.">
