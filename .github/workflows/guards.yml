name: guards

# Runs on every PR to main. This repo is public and `guards` is a required status check of the
# `main-protection` ruleset (see MAINTAINING.md section 5 and tests/templates/test-canonical-guards.sh),
# so a red `guards` blocks the merge. Job `guards` runs, in order:
#   - tests/templates/test-canonical-guards.sh : canonical guard net (invariants 2-22) plus
#     scripts/guards.cjs (R1 ratchet vs origin/main, all-tests-wired, version floor, and the `audit`
#     code-quality ratchet of scripts/audit.cjs against scripts/audit-baseline.json)
#   - scripts/run-flow-suite.cjs         : offline flow suite (templates/test-deliver-pipeline.js)
#   - scripts/run-offline.cjs --all fixtures : record/replay harness with the real parsers
#   - per-script regression tests: tests/scripts/test-*.sh, tests/hooks/test-*.sh and
#     tests/templates/test-*.sh (test-canonical-guards.sh runs first, above)
#   - scripts/gate-check.sh e2 --ci      : the E2 gate metrics that are evidence in the repository
#     (incident fixtures, eval grader pins); eval results and canary runs report SKIP here
# Job `smoke-install` loads the plugin through the real `claude` CLI.
# The all-tests-wired check in guards.cjs fails if a test suite is added without a step here.
#
# Trigger MUST stay `pull_request` and never `pull_request_target`: scripts/run-flow-suite.cjs
# runs the branch's own workflows/deliver-pipeline.js through `new Function(...)`, i.e. this job
# executes branch-authored code by design, and `pull_request_target` would give that code the
# BASE branch's token/secrets. The runner is ubuntu-latest (tests are deterministic and pinned).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guards:
    # #254: this job used to target the human's private, always-on machine — any external PR would
    # execute arbitrary branch-authored code (see the pull_request_target note above) on that
    # machine now that this repo is public. Tests are deterministic and pinned (lockfile, ruff
    # `required-version`, cached installs) and need no live service, so ubuntu-latest has full parity.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # guards.cjs version floor diffs against origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned tooling (audit)
        run: |
          npm ci
          pipx install ruff==0.16.10
      # Standard workflow linters, exact pins: the tools gain rules over time, so a version moves only by a deliberate edit.
      # Legacy findings are frozen in .github/actionlint.yaml and zizmor.yml (each entry commented); no home-made check.
      - name: Workflow lint (actionlint, zizmor)
        run: |
          pipx install actionlint-py==1.7.12.24
          pipx install zizmor==1.30.1
          actionlint -config-file .github/actionlint.yaml
          zizmor --offline --config zizmor.yml .github/workflows
      - name: Canonical guard net
        run: bash tests/templates/test-canonical-guards.sh
      - name: Offline flow suite
        run: FLOW_SUITE_STRICT=1 node scripts/run-flow-suite.cjs
      - name: Offline record/replay harness (raw fixtures, real parsers)
        run: OFFLINE_STRICT=1 node scripts/run-offline.cjs --all fixtures
      - name: run-offline self-test
        run: bash tests/scripts/test-run-offline.sh
      - name: capture-incident self-test
        run: bash tests/scripts/test-capture-incident.sh
      - name: redact-fixture self-test
        run: bash tests/scripts/test-redact-fixture.sh
      - name: agent-context self-test
        run: bash tests/scripts/test-agent-context.sh
      - name: context-print self-test
        run: bash tests/scripts/test-context-print.sh
      - name: init-specifics self-test
        run: bash tests/scripts/test-init-specifics.sh
      - name: config-check self-test
        run: bash tests/scripts/test-config-check.sh
      - name: publish-fixture self-test
        run: bash tests/scripts/test-publish-fixture.sh
      - name: Stop-supervise watchdog regression test
        run: bash tests/hooks/test-Stop-supervise-runs.sh
      - name: deny-destructive-git hook regression test
        run: bash tests/hooks/test-deny-destructive-git.sh
      - name: SubagentStop worktree-cleanup hook regression test
        run: bash tests/hooks/test-SubagentStop-worktree-cleanup.sh
      - name: probe attest and stop hooks regression test
        run: bash tests/hooks/test-PostToolUse-probe-attest.sh
      - name: probe-run runner regression test
        run: bash tests/templates/test-probe-run.sh
      - name: cleanup-worktree script regression test
        run: bash tests/scripts/test-cleanup-worktree.sh
      - name: verify-workflow-launch regression test
        run: bash tests/scripts/test-verify-workflow-launch.sh
      - name: Provision worktree guard
        run: bash tests/templates/test-provision-worktree.sh
      - name: Blocked-by check regression test
        run: bash tests/templates/test-blocked-by-check.sh
      - name: gh-pipeline-status regression test
        run: bash tests/templates/test-gh-pipeline-status.sh
      - name: guards.cjs regression test
        run: bash tests/scripts/test-guards.sh
      - name: audit self-test
        run: bash tests/scripts/test-audit.sh
      - name: lead-merge script regression test
        run: bash tests/scripts/test-lead-merge.sh
      - name: marker spelling parity test
        run: bash tests/scripts/test-marker-parity.sh
      - name: tick equivalence test
        run: bash tests/scripts/test-tick-equivalence.sh
      - name: plugin-versions script regression test
        run: bash tests/scripts/test-plugin-versions.sh
      - name: block-merge-unchecked hook regression test
        run: bash tests/hooks/test-block-merge-unchecked.sh
      - name: probe eval cases offline validation
        run: bash tests/scripts/test-probe-evals.sh
      - name: gate-check script regression test
        run: bash tests/scripts/test-gate-check.sh
      - name: E2 gate metrics, structural (eval results and canary runs are not in CI)
        run: bash scripts/gate-check.sh e2 --ci

  smoke-install:
    # First-install regression guard (legacy#60): MAINTAINING.md §3's documented command
    # (`claude plugin install lgtmgate@zigzag-plugins`) turned out to fail on a genuinely fresh
    # setup without an undocumented `marketplace update` step first. This job re-runs the real
    # `claude` CLI's plugin-loading path on every PR so that class of regression fails CI instead
    # of a human hitting it.
    #
    # Known scope limit: `marketplace.json`'s own `lgtmgate` entry is a self-referential `github`
    # source pinned to `ref: main` — installing straight from it would silently validate
    # already-merged `main`, never this PR's own diff. The step below works around that by
    # installing from a throwaway copy of `marketplace.json` with the `lgtmgate` entry's `source`
    # swapped to the local checkout path — never committed, CI-only. This validates "does the
    # plugin as it exists in this PR load through the real CLI" (manifest, hooks, workflows,
    # commands all resolve) — it does NOT re-exercise the GitHub-hosted fetch/sha-pin path itself,
    # which needs a merged commit to test for real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      # Exact pin: the validator gains rules over time, so the version moves only by a deliberate edit.
      # The version lives in .devcontainer/package.json, its integrity hash in the lockfile next to it.
      - name: Install Claude Code CLI (lockfile, integrity-checked)
        run: |
          npm ci --prefix .devcontainer
          echo "$GITHUB_WORKSPACE/.devcontainer/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Validate marketplace and plugin manifests as committed (stable, backlog, beta copy), strict
        run: |
          claude plugin validate ./ --strict
          claude plugin validate ./plugins/backlog --strict
          beta_dir="$(mktemp -d "${TMPDIR:-/tmp}/beta.XXXXXX")"
          mkdir "$beta_dir/.claude-plugin"
          cp .claude-plugin/marketplace-beta.json "$beta_dir/.claude-plugin/marketplace.json"
          claude plugin validate "$beta_dir" --strict
      - name: Point the lgtmgate entry at this checkout (CI-only, never committed)
        run: |
          python3 - <<'PY'
          import json
          path = ".claude-plugin/marketplace.json"
          with open(path) as f:
              data = json.load(f)
          for entry in data["plugins"]:
              if entry["name"] == "lgtmgate":
                  entry["source"] = "./"
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
          PY
      - name: Add local marketplace and install lgtmgate as a first-time user would
        run: |
          claude plugin marketplace add ./
          claude plugin install lgtmgate@zigzag-plugins
      - name: Confirm it actually loaded (manifest + hooks + workflows resolved, no errors)
        run: |
          claude plugin list | tee /tmp/plugin-list.txt
          grep -q "lgtmgate@zigzag-plugins" /tmp/plugin-list.txt
          claude plugin details lgtmgate | tee /tmp/plugin-details.txt
          ! grep -qi "error" /tmp/plugin-details.txt
