name: scorecard

# Recurring OpenSSF Scorecard posture check (epic #287, slice S3).
# NON-REQUIRED by design: it is not part of the `main-protection` ruleset and must never become a
# required check. Triggers are push on main, a weekly cron and manual dispatch only; never
# `pull_request` / `pull_request_target` (this job holds `id-token: write`).
# Known limit: the Branch-Protection check may score low or -1 with the default GITHUB_TOKEN (it
# needs an admin PAT passed as `repo_token`); no secret is configured on purpose.
# CodeQL stays on GitHub default setup: no codeql.yml belongs here.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
