name: scorecard

# Recurring OpenSSF Scorecard posture check (epic #287, slice S3).
# NON-REQUIRED by design: it is not part of the `main-protection` ruleset and must never become a
# required check. Triggers are push on main, a weekly cron and manual dispatch only; never
# `pull_request` / `pull_request_target` (this job holds `id-token: write`).
# Known limit: the Branch-Protection check may score low or -1 with the default GITHUB_TOKEN (it
# needs an admin PAT passed as `repo_token`); no secret is configured on purpose.
# CodeQL stays on GitHub default setup: no codeql.yml belongs here.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
