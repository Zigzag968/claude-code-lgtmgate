<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lgtmgate — README header mockup</title>
<!--
  README header mockup for zigzag968/claude-code-lgtmgate — 1280×320, light only.
  Self-contained: no external assets, no JavaScript, CSS @keyframes only.

  Concept: an assembly line in steady state. Several GitHub issues are on the belt at once,
  one per station. Every 4 s the line does one cycle:
    ACT      0.4–1.6 s  the hoist lowers a new issue onto the belt, the print head lays the plan
                        on the parcel at PLAN, the press stamps the one at DEV (issue -> PR),
                        the scanner sweeps the one at REVIEW (approved badge)
    VERDICT  1.6–2.4 s  the gate screen blinks, flips red -> green, "LGTM", barrier lifts,
                        stamp hits the reviewed parcel
    INDEX    2.5–3.4 s  the belt advances one station; the LGTM'd parcel leaves through the gate
    CLOSE    3.5–3.9 s  barrier down, screen back to red
  Each parcel still makes the whole journey (16 s = 4 cycles): one set of journey keyframes is
  applied to four parcel elements with animation-delay 0 / -4 / -8 / -12 s.
  A parcel never becomes "merged": LGTM means mergeable; merging stays a human gesture.

  Easings: Material 3 motion tokens (emphasized .2,0,0,1 · decelerate .05,.7,.1,1 ·
  accelerate .3,0,.8,.15) and easings.net (easeOutBack .34,1.56,.64,1 · easeInOutCubic
  .65,0,.35,1 · easeOutCubic .33,1,.68,1 · easeInQuad .11,0,.5,0 · easeOutQuint .22,1,.36,1).
  Colours: GitHub Primer base scale (green #1f883d/#1a7f37, red #cf222e, ink #1f2328,
  muted #59636e, border #d1d9e0) + the existing brand purple #4b2fe0 / #8b6bff.
-->
<style>
  :root {
    --cycle: 4s;                 /* scene loop */
    --journey: 16s;              /* one parcel, four cycles */
    --ink: #111318;
    --ink-2: #1f2328;
    --muted: #59636e;
    --label: #6e7781;
    --line: #d1d9e0;
    --canvas: #ffffff;
    --canvas-2: #f6f8fa;
    --purple: #4b2fe0;
    --purple-2: #8b6bff;
    --green: #1f883d;
    --green-fg: #1a7f37;
    --red: #cf222e;
    --blue: #0969da;
    --steel: #3d444d;
    --belt: #2b3137;
    --sans: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  }

  html, body { margin: 0; background: var(--canvas-2); }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 40px 24px; box-sizing: border-box;
    font-family: var(--sans); color: var(--ink-2); -webkit-font-smoothing: antialiased;
  }
  .stage { width: 1280px; max-width: 100%; }

  /* ───────────────────────── banner ───────────────────────── */
  .banner {
    position: relative; width: 1280px; height: 320px; overflow: hidden;
    background: var(--canvas); border: 1px solid var(--line); border-radius: 16px; box-sizing: content-box;
    box-shadow: 0 1px 2px rgba(31,35,40,.04), 0 24px 48px -32px rgba(31,35,40,.25);
  }

  /* ───────────────────────── brand block ───────────────────────── */
  .brand { position: absolute; left: 56px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 22px; z-index: 10; }
  .mark {
    position: relative; width: 64px; height: 64px; border-radius: 16px; flex: none;
    background: linear-gradient(135deg, var(--purple-2), var(--purple));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 10px 22px -12px rgba(75,47,224,.55);
    animation: mark-glow var(--cycle) infinite;
  }
  .mark .disp { position: absolute; left: 10px; top: 13px; width: 44px; height: 38px; border-radius: 8px; background: #16191d; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); animation: mark-disp var(--cycle) infinite; }
  .mark .disp svg { position: absolute; inset: 0; margin: auto; width: 24px; height: 24px; }
  .mark .disp path { fill: none; stroke: #6e7681; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; animation: mark-check var(--cycle) infinite; }

  .text { display: flex; flex-direction: column; }
  .eyebrow { font: 700 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .title { font: 700 48px/1 var(--sans); letter-spacing: -1.6px; color: var(--ink); margin: 0 0 8px; }
  .title b { color: var(--purple); font-weight: 700; }
  .tagline { font: 400 17px/1.3 var(--sans); color: #5b6472; max-width: 262px; margin: 0; }

  /* ───────────────────────── the line ───────────────────────── */
  .line { position: absolute; left: 450px; top: 0; width: 860px; height: 320px; }

  .rail { position: absolute; left: 24px; top: 58px; width: 566px; height: 3px; border-radius: 2px; background: var(--line); }
  .rail::before, .rail::after { content: ""; position: absolute; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .rail::before { left: -4px; } .rail::after { right: -4px; }

  .belt {
    position: absolute; left: 8px; top: 232px; width: 852px; height: 16px; border-radius: 8px; z-index: 2;
    background-color: var(--belt);
    background-image: linear-gradient(90deg, transparent 0 10px, rgba(255,255,255,.2) 10px 15px);
    background-size: 15px 100%; background-repeat: repeat-x;
    animation: belt var(--cycle) infinite;
  }
  .belt-shadow { position: absolute; left: 20px; top: 244px; width: 828px; height: 14px; border-radius: 50%; background: rgba(31,35,40,.16); filter: blur(6px); z-index: 1; }

  .lb { position: absolute; top: 276px; transform: translateX(-50%); white-space: nowrap; font: 700 12px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--label); }
  .lb::before { content: ""; position: absolute; left: 50%; top: -22px; width: 1px; height: 16px; background: currentColor; opacity: .5; }
  .lb-plan   { left: 225px; }
  .lb-dev    { left: 390px; }
  .lb-review { left: 555px; }
  .lb-lgtm   { left: 668px; animation: lb-lgtm var(--cycle) infinite; }

  /* hoist at the intake */
  .trolley { position: absolute; left: 46px; top: 53px; width: 28px; height: 12px; border-radius: 4px; background: var(--steel); z-index: 3; }
  .crane { position: absolute; left: 44px; top: 61px; width: 32px; height: 105px; overflow: hidden; z-index: 4; }
  .crane .rig { position: absolute; left: 0; top: 0; width: 32px; height: 105px; animation: crane var(--cycle) infinite; }
  .crane .cable { position: absolute; left: 15px; top: 0; width: 2px; height: 100px; background: #8b949e; }
  .crane .grip { position: absolute; left: 4px; top: 99px; width: 24px; height: 6px; border-radius: 2px 2px 0 0; background: var(--steel); }

  /* fixtures hanging from the rail */
  .fx { position: absolute; top: 61px; z-index: 3; }
  .fx .hanger { position: absolute; left: -1px; top: 0; width: 2px; background: var(--line); }

  .fx-plan { left: 225px; }
  .fx-plan .hanger { height: 52px; }
  .fx-plan .head { position: absolute; left: -19px; top: 52px; width: 38px; height: 16px; border-radius: 4px; background: var(--steel); animation: plan-head var(--cycle) infinite; }
  .fx-plan .head::after { content: ""; position: absolute; left: 13px; top: 16px; border: 6px solid transparent; border-top: 7px solid var(--steel); border-bottom: 0; }

  .fx-dev { left: 390px; }
  .fx-dev .rod { position: absolute; left: -3px; top: 0; width: 6px; height: 48px; background: #6e7781; transform-origin: 50% 0; animation: press-rod var(--cycle) infinite; }
  .fx-dev .head { position: absolute; left: -24px; top: 46px; width: 48px; height: 18px; border-radius: 4px; background: var(--steel); animation: press-head var(--cycle) infinite; }

  .fx-scan { left: 555px; }
  .fx-scan .hanger { height: 44px; }
  .fx-scan .body { position: absolute; left: -20px; top: 44px; width: 40px; height: 18px; border-radius: 4px; background: var(--steel); }
  .fx-scan .lens { position: absolute; left: -6px; top: 56px; width: 12px; height: 12px; border-radius: 50%; background: #2b3137; box-shadow: inset 0 0 0 2px var(--steel); animation: lens var(--cycle) infinite; }
  .fx-scan .beam { position: absolute; left: -1px; top: 62px; width: 3px; height: 108px; opacity: 0; background: linear-gradient(180deg, rgba(9,105,218,.95), rgba(9,105,218,.35)); animation: beam var(--cycle) infinite; }
  .fx-scan .beam::after { content: ""; position: absolute; left: -13px; top: 0; width: 28px; height: 100%; background: linear-gradient(90deg, transparent, rgba(9,105,218,.25), transparent); }

  /* ───────────────────────── parcels (one GitHub issue each) ───────────────────────── */
  .parcel { position: absolute; left: -44px; top: 166px; width: 88px; height: 66px; z-index: 3; will-change: transform; animation: journey var(--journey) infinite; animation-delay: var(--d, 0s); }
  .parcel .body {
    position: absolute; inset: 0; border-radius: 10px; background: #fff; border: 1.5px solid #c9d1d9; box-sizing: border-box; overflow: hidden;
    box-shadow: 0 10px 18px -10px rgba(31,35,40,.5); transform-origin: 50% 100%;
    animation: squash var(--journey) infinite; animation-delay: var(--d, 0s);
  }
  .parcel .band { position: absolute; left: 0; top: 0; width: 100%; height: 11px; background: linear-gradient(90deg, var(--purple-2), var(--purple)); transform: scaleX(0); transform-origin: 0 50%; animation: band var(--journey) infinite; animation-delay: var(--d, 0s); }
  .parcel .glyph { position: absolute; left: 0; right: 0; top: 11px; bottom: 0; }
  .parcel .glyph svg { position: absolute; inset: 0; margin: auto; width: 28px; height: 28px; }
  .parcel .glyph .issue { animation: ico-issue var(--journey) infinite; animation-delay: var(--d, 0s); }
  .parcel .glyph .pr { transform: scale(0); animation: ico-pr var(--journey) infinite; animation-delay: var(--d, 0s); }
  .parcel .badge { position: absolute; right: -7px; top: -7px; width: 20px; height: 20px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2.5px #fff; transform: scale(0); animation: badge var(--journey) infinite; animation-delay: var(--d, 0s); }
  .parcel .badge svg { position: absolute; inset: 0; margin: auto; width: 12px; height: 12px; }
  .parcel .badge path { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .parcel .stamp {
    position: absolute; left: 50%; top: 50%; padding: 4px 6px 3px; border: 2.5px solid var(--green-fg); border-radius: 5px;
    font: 800 14px/1 var(--sans); letter-spacing: .1em; color: var(--green-fg); background: rgba(255,255,255,.6); mix-blend-mode: multiply;
    opacity: 0; transform: translate(-50%, -42%) rotate(-12deg) scale(2.2); animation: stamp var(--journey) infinite; animation-delay: var(--d, 0s);
  }

  /* ───────────────────────── the gate ───────────────────────── */
  .gate { position: absolute; left: 610px; top: 0; width: 116px; height: 320px; }
  .gate .post { position: absolute; top: 140px; width: 6px; height: 92px; border-radius: 2px 2px 0 0; background: var(--muted); z-index: 5; }
  .gate .post.l { left: 0; } .gate .post.r { right: 0; }
  .gate .beam { position: absolute; left: 0; top: 136px; width: 116px; height: 8px; border-radius: 3px; background: var(--muted); z-index: 5; }
  .gate .bar { position: absolute; left: 9px; top: 198px; width: 98px; height: 6px; border-radius: 3px; background: var(--red); z-index: 4; animation: bar var(--cycle) infinite; }
  .gate .bar::before { content: ""; position: absolute; left: 0; top: 0; width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.55); }

  .screen {
    position: absolute; left: 2px; top: 62px; width: 112px; height: 74px; border-radius: 12px; z-index: 6;
    background: linear-gradient(135deg, var(--purple-2), var(--purple));
    animation: screen-glow var(--cycle) infinite;
  }
  .screen::before { content: ""; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .screen::after { content: ""; position: absolute; inset: -5px; border-radius: 17px; border: 2px solid var(--green); opacity: 0; animation: ring var(--cycle) infinite; }
  .screen .disp { position: absolute; inset: 8px; border-radius: 7px; background: #16191d; overflow: hidden; animation: disp var(--cycle) infinite; }

  .screen .closed { position: absolute; inset: 0; margin: auto; width: 28px; height: 28px; animation: closed var(--cycle) infinite; }
  .screen .closed svg { width: 28px; height: 28px; display: block; }
  .screen .closed circle { fill: none; stroke: var(--red); stroke-width: 3; }
  .screen .closed line { stroke: var(--red); stroke-width: 3; stroke-linecap: round; }

  .screen .ok { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .screen .ok svg { width: 26px; height: 26px; opacity: 0; transform: scale(.3); animation: ok-check var(--cycle) infinite; }
  .screen .ok path { fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .screen .ok .w { display: flex; font: 800 15px/1 var(--sans); letter-spacing: .14em; color: #fff; }
  .screen .ok .w i { font-style: normal; opacity: 0; transform: translateY(8px); }
  .screen .ok .w i:nth-child(1) { animation: letter-1 var(--cycle) infinite; }
  .screen .ok .w i:nth-child(2) { animation: letter-2 var(--cycle) infinite; }
  .screen .ok .w i:nth-child(3) { animation: letter-3 var(--cycle) infinite; }
  .screen .ok .w i:nth-child(4) { animation: letter-4 var(--cycle) infinite; }

  /* ───────────────────────── scene keyframes — 4 s cycle, 1 s = 25 % ───────────────────────── */
  @keyframes belt {
    0%, 62.5%  { background-position: 0 0;     animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
    85%, 100%  { background-position: 165px 0; }
  }
  @keyframes crane {
    0%, 10%    { transform: translateY(-240px); animation-timing-function: cubic-bezier(.4, 0, .15, 1); }
    35%, 40%   { transform: translateY(0);      animation-timing-function: cubic-bezier(.4, 0, .6, 1); }
    50%, 100%  { transform: translateY(-240px); }
  }
  /* PLAN: print head descends, one stroke lays the plan band, rises */
  @keyframes plan-head {
    0%, 10%    { transform: translate(0, 0);        animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
    15%        { transform: translate(-30px, 32px); animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    32.5%      { transform: translate(30px, 32px);  animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
    40%, 100%  { transform: translate(0, 0); }
  }
  /* DEV: wind-up, slam, hold, rise */
  @keyframes press-head {
    0%, 15%        { transform: translateY(0);    animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    20%            { transform: translateY(-6px); animation-timing-function: cubic-bezier(.11, 0, .5, 0); }
    23.75%, 27.5%  { transform: translateY(40px); animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    37.5%, 100%    { transform: translateY(0); }
  }
  @keyframes press-rod {
    0%, 15%        { transform: scaleY(1);     animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    20%            { transform: scaleY(.875);  animation-timing-function: cubic-bezier(.11, 0, .5, 0); }
    23.75%, 27.5%  { transform: scaleY(1.833); animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    37.5%, 100%    { transform: scaleY(1); }
  }
  /* REVIEW: lens on, one sweep, off */
  @keyframes lens {
    0%, 10%    { background: #2b3137;    box-shadow: inset 0 0 0 2px var(--steel), 0 0 0 0 rgba(9,105,218,0); }
    12.5%, 35% { background: var(--blue); box-shadow: inset 0 0 0 2px var(--steel), 0 0 10px 1px rgba(9,105,218,.6); }
    40%, 100%  { background: #2b3137;    box-shadow: inset 0 0 0 2px var(--steel), 0 0 0 0 rgba(9,105,218,0); }
  }
  @keyframes beam {
    0%, 12.5%  { transform: translateX(-42px); opacity: 0; }
    13.5%      { transform: translateX(-42px); opacity: 1; animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    32.5%      { transform: translateX(42px);  opacity: 1; }
    35%        { transform: translateX(42px);  opacity: 0; }
    36%, 100%  { transform: translateX(-42px); opacity: 0; }
  }
  /* GATE: blink → flash → green → check → letters → barrier; then back to red */
  @keyframes closed {
    0%, 40%       { opacity: 1;   transform: scale(1); }
    42.5%         { opacity: .15; transform: scale(1); }
    45%           { opacity: 1;   transform: scale(1); }
    47.5%         { opacity: .15; transform: scale(1); }
    48.75%        { opacity: 1;   transform: scale(1);  animation-timing-function: cubic-bezier(.32, 0, .67, 0); }
    50%, 92.5%    { opacity: 0;   transform: scale(.6); animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    96.25%, 100%  { opacity: 1;   transform: scale(1); }
  }
  @keyframes disp {
    0%, 48.75%    { background-color: #16191d;      animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    50%           { background-color: #e6f7ea;      animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    53.75%, 87.5% { background-color: var(--green); animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    97.5%, 100%   { background-color: #16191d; }
  }
  @keyframes ok-check {
    0%, 50%       { opacity: 0; transform: scale(.3); animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); }
    58.75%, 87.5% { opacity: 1; transform: scale(1); }
    91.25%, 100%  { opacity: 0; transform: scale(.3); }
  }
  @keyframes letter-1 { 0%, 52.5%  { opacity: 0; transform: translateY(8px); animation-timing-function: cubic-bezier(.22, 1, .36, 1); } 56.25%, 87.5% { opacity: 1; transform: translateY(0); } 91.25%, 100% { opacity: 0; transform: translateY(8px); } }
  @keyframes letter-2 { 0%, 53.75% { opacity: 0; transform: translateY(8px); animation-timing-function: cubic-bezier(.22, 1, .36, 1); } 57.5%, 87.5%  { opacity: 1; transform: translateY(0); } 91.25%, 100% { opacity: 0; transform: translateY(8px); } }
  @keyframes letter-3 { 0%, 55%    { opacity: 0; transform: translateY(8px); animation-timing-function: cubic-bezier(.22, 1, .36, 1); } 58.75%, 87.5% { opacity: 1; transform: translateY(0); } 91.25%, 100% { opacity: 0; transform: translateY(8px); } }
  @keyframes letter-4 { 0%, 56.25% { opacity: 0; transform: translateY(8px); animation-timing-function: cubic-bezier(.22, 1, .36, 1); } 60%, 87.5%    { opacity: 1; transform: translateY(0); } 91.25%, 100% { opacity: 0; transform: translateY(8px); } }
  @keyframes screen-glow {
    0%, 48.75%   { box-shadow: 0 10px 22px -12px rgba(75,47,224,.55), 0 0 22px -2px rgba(207,34,46,.45); animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    55%, 87.5%   { box-shadow: 0 10px 22px -12px rgba(75,47,224,.55), 0 0 48px 4px rgba(31,136,61,.55); animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    97.5%, 100%  { box-shadow: 0 10px 22px -12px rgba(75,47,224,.55), 0 0 22px -2px rgba(207,34,46,.45); }
  }
  @keyframes ring {
    0%, 49.9%   { transform: scale(1); opacity: 0; }
    50%         { transform: scale(1); opacity: .6; animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    62.5%, 100% { transform: scale(1.45); opacity: 0; }
  }
  @keyframes bar {
    0%, 51.25%    { transform: translateY(0);     background-color: var(--red);   animation-timing-function: cubic-bezier(.05, .7, .1, 1); }
    61.25%, 87.5% { transform: translateY(-62px); background-color: var(--green); animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
    96.25%, 100%  { transform: translateY(0);     background-color: var(--red); }
  }
  @keyframes mark-disp  { 0%, 52.5% { background-color: #16191d; } 57.5%, 87.5% { background-color: var(--green); } 95%, 100% { background-color: #16191d; } }
  @keyframes mark-check { 0%, 52.5% { stroke: #6e7681; } 57.5%, 87.5% { stroke: #fff; } 95%, 100% { stroke: #6e7681; } }
  @keyframes mark-glow {
    0%, 52.5%    { box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 10px 22px -12px rgba(75,47,224,.55), 0 0 0 0 rgba(31,136,61,0); }
    57.5%, 87.5% { box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 10px 22px -12px rgba(75,47,224,.55), 0 0 28px 2px rgba(31,136,61,.35); }
    95%, 100%    { box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 10px 22px -12px rgba(75,47,224,.55), 0 0 0 0 rgba(31,136,61,0); }
  }
  @keyframes lb-lgtm { 0%, 50% { color: var(--label); } 53.75%, 87.5% { color: var(--green-fg); } 92.5%, 100% { color: var(--label); } }

  /* ───────────────────────── parcel journey — 16 s, 1 s = 6.25 % ───────────────────────── */
  @keyframes journey {
    0%, 2.5%         { transform: translate(60px, -240px); animation-timing-function: cubic-bezier(.4, 0, .15, 1); }  /* lowered by the hoist */
    8.75%, 15.625%   { transform: translate(60px, 0);      animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
    21.25%, 40.625%  { transform: translate(225px, 0);     animation-timing-function: cubic-bezier(.2, 0, 0, 1); }   /* PLAN */
    46.25%, 65.625%  { transform: translate(390px, 0);     animation-timing-function: cubic-bezier(.2, 0, 0, 1); }   /* DEV */
    71.25%, 90.625%  { transform: translate(555px, 0);     animation-timing-function: cubic-bezier(.2, 0, 0, 1); }   /* REVIEW + gate; same curve as the followers so it stays ahead */
    96.25%           { transform: translate(920px, 0);     animation-timing-function: step-end; }                    /* out through the gate */
    96.875%, 100%    { transform: translate(60px, -240px); }
  }
  @keyframes squash {
    0%, 8.5%       { transform: scale(1, 1); }
    8.75%          { transform: scale(1.03, .95); animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); }  /* landing */
    10%, 55.6%     { transform: scale(1, 1); }
    56%            { transform: scale(1.05, .9);  animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); }  /* press impact */
    58%, 100%      { transform: scale(1, 1); }
  }
  @keyframes band      { 0%, 28.75%   { transform: scaleX(0); animation-timing-function: cubic-bezier(.65, 0, .35, 1); } 33.125%, 96.25% { transform: scaleX(1); animation-timing-function: step-end; } 96.875%, 100% { transform: scaleX(0); } }
  @keyframes ico-issue { 0%, 55.9%    { transform: scale(1); animation-timing-function: cubic-bezier(.32, 0, .67, 0); } 56.5%, 96.25%   { transform: scale(0); animation-timing-function: step-end; } 96.875%, 100% { transform: scale(1); } }
  @keyframes ico-pr    { 0%, 56.25%   { transform: scale(0); animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); } 57.5%, 96.25% { transform: scale(1); animation-timing-function: step-end; } 96.875%, 100% { transform: scale(0); } }
  @keyframes badge     { 0%, 83.125%  { transform: scale(0); animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); } 85%, 96.25%   { transform: scale(1); animation-timing-function: step-end; } 96.875%, 100% { transform: scale(0); } }
  @keyframes stamp {
    0%, 88.75%      { opacity: 0; transform: translate(-50%, -42%) rotate(-12deg) scale(2.2); animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); }
    90.625%, 96.25% { opacity: 1; transform: translate(-50%, -42%) rotate(-12deg) scale(1);   animation-timing-function: step-end; }
    96.875%, 100%   { opacity: 0; transform: translate(-50%, -42%) rotate(-12deg) scale(2.2); }
  }

  /* reduced motion: hold the LGTM frame as a still */
  @media (prefers-reduced-motion: reduce) {
    .banner *, .banner *::before, .banner *::after { animation-play-state: paused !important; }
    .banner * { animation-delay: calc(var(--d, 0s) - 2.3s) !important; }
    .banner *::before, .banner *::after { animation-delay: -2.3s !important; }
    .playhead { display: none; }
  }

  /* ───────────────────────── mockup chrome (not part of the header) ───────────────────────── */
  .meta { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 4px 0; font: 500 12px/1.4 var(--sans); color: var(--label); }
  .timeline { position: relative; margin: 10px 4px 0; height: 26px; }
  .timeline .track { position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: var(--line); border-radius: 1px; }
  .timeline .playhead { position: absolute; left: 0; top: 0; width: 2px; height: 10px; background: var(--purple); border-radius: 1px; animation: playhead var(--cycle) linear infinite; }
  .timeline .beat { position: absolute; top: 12px; transform: translateX(-50%); font: 500 10px/1 var(--sans); color: var(--label); white-space: nowrap; }
  .timeline .beat::before { content: ""; position: absolute; left: 50%; top: -9px; width: 1px; height: 6px; background: var(--line); }
  @keyframes playhead { from { left: 0; } to { left: 100%; } }
</style>
</head>
<body>
<div class="stage">
  <div class="banner" role="img" aria-label="lgtmgate — GitHub issues move down an assembly line through plan, dev and review; the gate screen turns green, reads LGTM, and the reviewed pull request leaves the line">

    <!-- brand -->
    <div class="brand">
      <div class="mark" aria-hidden="true"><div class="disp"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div></div>
      <div class="text">
        <div class="eyebrow">Claude Code plugin</div>
        <h1 class="title"><b>lgtm</b>gate</h1>
        <p class="tagline">Merge gate for agent-generated pull requests</p>
      </div>
    </div>

    <!-- the line -->
    <div class="line" aria-hidden="true">
      <div class="rail"></div>

      <div class="trolley"></div>
      <div class="crane"><div class="rig"><div class="cable"></div><div class="grip"></div></div></div>

      <div class="fx fx-plan"><div class="hanger"></div><div class="head"></div></div>
      <div class="fx fx-dev"><div class="rod"></div><div class="head"></div></div>
      <div class="fx fx-scan"><div class="hanger"></div><div class="body"></div><div class="lens"></div><div class="beam"></div></div>

      <div class="belt-shadow"></div>
      <div class="belt"></div>

      <!-- four parcels, one journey, staggered by one cycle each -->
      <div class="parcel" style="--d: 0s">
        <div class="body"><div class="band"></div><div class="glyph">
          <svg class="issue" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#1a7f37" stroke-width="1.8"/><circle cx="8" cy="8" r="1.7" fill="#1a7f37"/></svg>
          <svg class="pr" viewBox="0 0 16 16" fill="none" stroke="#1a7f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="3.5" r="1.9"/><circle cx="4" cy="12.5" r="1.9"/><circle cx="12" cy="12.5" r="1.9"/><path d="M4 5.4v5.2"/><path d="M8.6 3.5H10a2 2 0 0 1 2 2v5.1"/><path d="M7.2 1.6 8.9 3.5 7.2 5.4"/></svg>
        </div></div>
        <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <div class="stamp">LGTM</div>
      </div>
      <div class="parcel" style="--d: -4s">
        <div class="body"><div class="band"></div><div class="glyph">
          <svg class="issue" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#1a7f37" stroke-width="1.8"/><circle cx="8" cy="8" r="1.7" fill="#1a7f37"/></svg>
          <svg class="pr" viewBox="0 0 16 16" fill="none" stroke="#1a7f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="3.5" r="1.9"/><circle cx="4" cy="12.5" r="1.9"/><circle cx="12" cy="12.5" r="1.9"/><path d="M4 5.4v5.2"/><path d="M8.6 3.5H10a2 2 0 0 1 2 2v5.1"/><path d="M7.2 1.6 8.9 3.5 7.2 5.4"/></svg>
        </div></div>
        <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <div class="stamp">LGTM</div>
      </div>
      <div class="parcel" style="--d: -8s">
        <div class="body"><div class="band"></div><div class="glyph">
          <svg class="issue" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#1a7f37" stroke-width="1.8"/><circle cx="8" cy="8" r="1.7" fill="#1a7f37"/></svg>
          <svg class="pr" viewBox="0 0 16 16" fill="none" stroke="#1a7f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="3.5" r="1.9"/><circle cx="4" cy="12.5" r="1.9"/><circle cx="12" cy="12.5" r="1.9"/><path d="M4 5.4v5.2"/><path d="M8.6 3.5H10a2 2 0 0 1 2 2v5.1"/><path d="M7.2 1.6 8.9 3.5 7.2 5.4"/></svg>
        </div></div>
        <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <div class="stamp">LGTM</div>
      </div>
      <div class="parcel" style="--d: -12s">
        <div class="body"><div class="band"></div><div class="glyph">
          <svg class="issue" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#1a7f37" stroke-width="1.8"/><circle cx="8" cy="8" r="1.7" fill="#1a7f37"/></svg>
          <svg class="pr" viewBox="0 0 16 16" fill="none" stroke="#1a7f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="3.5" r="1.9"/><circle cx="4" cy="12.5" r="1.9"/><circle cx="12" cy="12.5" r="1.9"/><path d="M4 5.4v5.2"/><path d="M8.6 3.5H10a2 2 0 0 1 2 2v5.1"/><path d="M7.2 1.6 8.9 3.5 7.2 5.4"/></svg>
        </div></div>
        <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <div class="stamp">LGTM</div>
      </div>

      <div class="gate">
        <div class="post l"></div><div class="post r"></div>
        <div class="beam"></div>
        <div class="bar"></div>
        <div class="screen">
          <div class="disp">
            <div class="closed"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11"/><line x1="9.5" y1="15" x2="20.5" y2="15"/></svg></div>
            <div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span class="w"><i>L</i><i>G</i><i>T</i><i>M</i></span></div>
          </div>
        </div>
      </div>

      <div class="lb lb-plan">Plan</div>
      <div class="lb lb-dev">Dev</div>
      <div class="lb lb-review">Review</div>
      <div class="lb lb-lgtm">LGTM</div>
    </div>
  </div>

  <!-- mockup chrome: helps reviewing the loop; not part of the header itself -->
  <div class="meta"><span>README header mockup · 1280 × 320 · light</span><span>CSS keyframes only · scene loops every 4 s · each parcel travels 16 s</span></div>
  <div class="timeline">
    <div class="track"></div><div class="playhead"></div>
    <div class="beat" style="left:10%">act: hoist · plan · dev · review</div>
    <div class="beat" style="left:40%">verdict</div>
    <div class="beat" style="left:50%">green</div>
    <div class="beat" style="left:62.5%">index</div>
    <div class="beat" style="left:87.5%">close</div>
  </div>
</div>
</body>
</html>
