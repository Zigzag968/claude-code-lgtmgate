<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lgtmgate — README header mockup</title>
<!--
  README header mockup for zigzag968/claude-code-lgtmgate — 1280×320, light only.
  Self-contained: no external assets, no JavaScript, CSS @keyframes only.

  Concept: an assembly line in steady state. Several GitHub issues are on the belt at once, one
  per station, and every station follows the same grammar: the parcel settles, the tool engages,
  the transformation happens at the point of contact, the tool releases. The stations fire in a
  left-to-right cascade (0.3 s apart), never all at once, so the eye reads the line in order.

  One 5 s cycle:
    0.5 s  hoist lowers a new issue onto the belt
    0.7 s  PLAN   print head touches the parcel and lays the plan band under its nib
    1.0 s  DEV    press hits the parcel: the issue glyph becomes a PR glyph on impact
    1.3 s  REVIEW scanner sweeps the parcel, approval badge appears when the beam returns
    1.6 s  LGTM   the parcel is inside the gate unit: screen blinks (evaluating), flips red -> green,
                  "LGTM", the exit door slides up, the parcel's band turns green
    3.0 s  INDEX  the belt advances one station; the LGTM'd parcel leaves through the open door
    4.0 s  CLOSE  door down, screen back to red
  Each parcel makes the whole journey (25 s = 5 cycles): one journey keyframe set applied to five
  parcel elements with animation-delay 0 / -5 / -10 / -15 / -20 s.
  A parcel never becomes "merged": LGTM means mergeable; merging stays a human gesture.

  Easings: Material 3 motion tokens (emphasized .2,0,0,1 · decelerate .05,.7,.1,1) and easings.net
  (easeOutBack .34,1.56,.64,1 · easeInOutCubic .65,0,.35,1 · easeOutCubic .33,1,.68,1 ·
  easeInQuad .11,0,.5,0 · easeOutQuint .22,1,.36,1 · easeInCubic .32,0,.67,0).
  Colours: GitHub Primer base scale (green #1f883d/#1a7f37, red #cf222e, ink #1f2328, muted #59636e,
  border #d1d9e0) + the existing brand purple #4b2fe0 / #8b6bff.
-->
<style>
  :root {
    --cycle: 5s;                 /* scene loop */
    --journey: 25s;              /* one parcel, five cycles */
    --ink: #111318;
    --ink-2: #1f2328;
    --muted: #59636e;
    --label: #6e7781;
    --line: #d1d9e0;
    --canvas: #ffffff;
    --canvas-2: #f6f8fa;
    --purple: #4b2fe0;
    --purple-2: #8b6bff;
    --green: #1f883d;
    --green-fg: #1a7f37;
    --red: #cf222e;
    --blue: #0969da;
    --steel: #3d444d;
    --belt: #2b3137;
    --sans: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  }

  html, body { margin: 0; background: var(--canvas-2); }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 40px 24px; box-sizing: border-box;
    font-family: var(--sans); color: var(--ink-2); -webkit-font-smoothing: antialiased;
  }
  /* the banner is a fixed 1280×320 composition; the mockup page scales it down on narrow viewports */
  .stage { --s: 1; width: calc(1280px * var(--s)); max-width: 100%; }
  .wrap { position: relative; width: calc(1280px * var(--s)); height: calc(322px * var(--s)); }
  .wrap .banner { position: absolute; left: 0; top: 0; transform: scale(var(--s)); transform-origin: 0 0; }
  @media (max-width: 1340px) { .stage { --s: .75; } }
  @media (max-width: 1040px) { .stage { --s: .55; } }
  @media (max-width: 760px)  { .stage { --s: .35; } body { padding: 24px 16px; } }
  @media (max-width: 480px)  { .stage { --s: .25; } }

  /* ───────────────────────── banner ───────────────────────── */
  .banner {
    position: relative; width: 1280px; height: 320px; overflow: hidden;
    background: var(--canvas); border: 1px solid var(--line); border-radius: 16px; box-sizing: content-box;
    box-shadow: 0 1px 2px rgba(31,35,40,.04), 0 24px 48px -32px rgba(31,35,40,.25);
  }

  /* ───────────────────────── brand block ───────────────────────── */
  .brand { position: absolute; left: 56px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 22px; z-index: 10; }
  .mark {
    position: relative; width: 64px; height: 64px; border-radius: 16px; flex: none;
    background: linear-gradient(135deg, var(--purple-2), var(--purple));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 10px 22px -12px rgba(75,47,224,.55);
    animation: mark-glow var(--cycle) infinite;
  }
  .mark .disp { position: absolute; left: 10px; top: 13px; width: 44px; height: 38px; border-radius: 8px; background: #16191d; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); animation: mark-disp var(--cycle) infinite; }
  .mark .disp svg { position: absolute; inset: 0; margin: auto; width: 24px; height: 24px; }
  .mark .disp path { fill: none; stroke: #6e7681; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; animation: mark-check var(--cycle) infinite; }

  .text { display: flex; flex-direction: column; }
  .eyebrow { font: 700 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .title { font: 700 48px/1 var(--sans); letter-spacing: -1.6px; color: var(--ink); margin: 0 0 8px; }
  .title b { color: var(--purple); font-weight: 700; }
  .tagline { font: 400 17px/1.3 var(--sans); color: #5b6472; max-width: 262px; margin: 0; }

  /* ───────────────────────── the line ───────────────────────── */
  .line { position: absolute; left: 450px; top: 0; width: 860px; height: 320px; }

  .rail { position: absolute; left: 24px; top: 58px; width: 540px; height: 3px; border-radius: 2px; background: var(--line); }
  .rail::before, .rail::after { content: ""; position: absolute; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .rail::before { left: -4px; } .rail::after { right: -4px; }

  .belt {
    position: absolute; left: 8px; top: 232px; width: 852px; height: 16px; border-radius: 8px; z-index: 2;
    background-color: var(--belt);
    background-image: linear-gradient(90deg, transparent 0 10px, rgba(255,255,255,.2) 10px 15px);
    background-size: 15px 100%; background-repeat: repeat-x;
    animation: belt var(--cycle) infinite;
  }
  .belt-shadow { position: absolute; left: 20px; top: 244px; width: 828px; height: 14px; border-radius: 50%; background: rgba(31,35,40,.16); filter: blur(6px); z-index: 1; }

  .lb { position: absolute; top: 276px; transform: translateX(-50%); white-space: nowrap; font: 700 12px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--label); }
  .lb::before { content: ""; position: absolute; left: 50%; top: -22px; width: 1px; height: 16px; background: currentColor; opacity: .5; }
  .lb-plan   { left: 210px; animation: lb-plan var(--cycle) infinite; }
  .lb-dev    { left: 360px; animation: lb-dev var(--cycle) infinite; }
  .lb-review { left: 510px; animation: lb-review var(--cycle) infinite; }
  .lb-lgtm   { left: 660px; animation: lb-lgtm var(--cycle) infinite; }

  /* hoist at the intake */
  .trolley { position: absolute; left: 46px; top: 53px; width: 28px; height: 12px; border-radius: 4px; background: var(--steel); z-index: 3; }
  .crane { position: absolute; left: 44px; top: 61px; width: 32px; height: 105px; overflow: hidden; z-index: 4; }
  .crane .rig { position: absolute; left: 0; top: 0; width: 32px; height: 105px; animation: crane var(--cycle) infinite; }
  .crane .cable { position: absolute; left: 15px; top: 0; width: 2px; height: 100px; background: #8b949e; }
  .crane .grip { position: absolute; left: 4px; top: 99px; width: 24px; height: 6px; border-radius: 2px 2px 0 0; background: var(--steel); }

  /* fixtures hanging from the rail */
  .fx { position: absolute; top: 61px; z-index: 3; }
  .fx .hanger { position: absolute; left: -1px; top: 0; width: 2px; background: var(--line); }

  .fx-plan { left: 210px; }
  .fx-plan .hanger { height: 52px; }
  .fx-plan .head { position: absolute; left: -19px; top: 52px; width: 38px; height: 16px; border-radius: 4px; background: var(--steel); animation: plan-head var(--cycle) infinite; }
  .fx-plan .head::after { content: ""; position: absolute; left: 13px; top: 16px; border: 6px solid transparent; border-top: 7px solid var(--steel); border-bottom: 0; }

  .fx-dev { left: 360px; }
  .fx-dev .rod { position: absolute; left: -3px; top: 0; width: 6px; height: 48px; background: #6e7781; transform-origin: 50% 0; animation: press-rod var(--cycle) infinite; }
  .fx-dev .head { position: absolute; left: -24px; top: 46px; width: 48px; height: 18px; border-radius: 4px; background: var(--steel); animation: press-head var(--cycle) infinite; }

  .fx-scan { left: 510px; }
  .fx-scan .hanger { height: 44px; }
  .fx-scan .body { position: absolute; left: -20px; top: 44px; width: 40px; height: 18px; border-radius: 4px; background: var(--steel); }
  .fx-scan .lens { position: absolute; left: -6px; top: 56px; width: 12px; height: 12px; border-radius: 50%; background: #2b3137; box-shadow: inset 0 0 0 2px var(--steel); animation: lens var(--cycle) infinite; }
  .fx-scan .beam { position: absolute; left: -1px; top: 62px; width: 3px; height: 108px; opacity: 0; background: linear-gradient(180deg, rgba(9,105,218,.95), rgba(9,105,218,.35)); animation: beam var(--cycle) infinite; }
  .fx-scan .beam::after { content: ""; position: absolute; left: -13px; top: 0; width: 28px; height: 100%; background: linear-gradient(90deg, transparent, rgba(9,105,218,.25), transparent); }

  /* ───────────────────────── parcels (one GitHub issue each) ───────────────────────── */
  .parcel { position: absolute; left: -44px; top: 166px; width: 88px; height: 66px; z-index: 3; will-change: transform; animation: journey var(--journey) infinite; animation-delay: var(--d, 0s); }
  .parcel .body {
    position: absolute; inset: 0; border-radius: 10px; background: #fff; border: 1.5px solid #c9d1d9; box-sizing: border-box; overflow: hidden;
    box-shadow: 0 10px 18px -10px rgba(31,35,40,.5); transform-origin: 50% 100%;
    animation: squash var(--journey) infinite; animation-delay: var(--d, 0s);
  }
  .parcel .band { position: absolute; left: 0; top: 0; width: 100%; height: 11px; background-color: var(--purple); transform: scaleX(0); transform-origin: 0 50%; animation: band var(--journey) infinite; animation-delay: var(--d, 0s); }
  .parcel .band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,.28), rgba(255,255,255,0)); }
  .parcel .glyph { position: absolute; left: 0; right: 0; top: 11px; bottom: 0; }
  .parcel .glyph svg { position: absolute; inset: 0; margin: auto; width: 28px; height: 28px; }
  .parcel .glyph .issue { animation: ico-issue var(--journey) infinite; animation-delay: var(--d, 0s); }
  .parcel .glyph .pr { transform: scale(0); animation: ico-pr var(--journey) infinite; animation-delay: var(--d, 0s); }
  .parcel .badge { position: absolute; right: -7px; top: -7px; width: 20px; height: 20px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2.5px #fff; transform: scale(0); animation: badge var(--journey) infinite; animation-delay: var(--d, 0s); }
  .parcel .badge svg { position: absolute; inset: 0; margin: auto; width: 12px; height: 12px; }
  .parcel .badge path { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

  /* ───────────────────────── the gate unit ───────────────────────── */
  .gate { position: absolute; left: 588px; top: 0; width: 144px; height: 320px; }
  .gate .post { position: absolute; top: 140px; width: 6px; height: 92px; border-radius: 2px 2px 0 0; background: var(--muted); z-index: 5; }
  .gate .post.l { left: 0; } .gate .post.r { right: 0; }
  .gate .beam { position: absolute; left: 0; top: 136px; width: 144px; height: 8px; border-radius: 3px; background: var(--muted); z-index: 5; }
  .gate .housing { position: absolute; right: 6px; top: 144px; width: 14px; height: 10px; border-radius: 0 0 3px 3px; background: var(--muted); z-index: 5; }
  .gate .door { position: absolute; right: 9px; top: 152px; width: 8px; height: 80px; border-radius: 3px; background: var(--red); z-index: 4; animation: door var(--cycle) infinite; }
  .gate .door::before { content: ""; position: absolute; left: 1px; top: 6px; width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.55); }

  .screen {
    position: absolute; left: 8px; top: 62px; width: 128px; height: 74px; border-radius: 12px; z-index: 6;
    background: linear-gradient(135deg, var(--purple-2), var(--purple));
    animation: screen-glow var(--cycle) infinite;
  }
  .screen::before { content: ""; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .screen::after { content: ""; position: absolute; inset: -5px; border-radius: 17px; border: 2px solid var(--green); opacity: 0; animation: ring var(--cycle) infinite; }
  .screen .disp { position: absolute; inset: 8px; border-radius: 7px; background: #16191d; overflow: hidden; animation: disp var(--cycle) infinite; }

  .screen .closed { position: absolute; inset: 0; margin: auto; width: 28px; height: 28px; animation: closed var(--cycle) infinite; }
  .screen .closed svg { width: 28px; height: 28px; display: block; }
  .screen .closed circle { fill: none; stroke: var(--red); stroke-width: 3; }
  .screen .closed line { stroke: var(--red); stroke-width: 3; stroke-linecap: round; }

  .screen .ok { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .screen .ok svg { width: 26px; height: 26px; opacity: 0; transform: scale(.3); animation: ok-check var(--cycle) infinite; }
  .screen .ok path { fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .screen .ok .w { display: flex; font: 800 15px/1 var(--sans); letter-spacing: .14em; color: #fff; }
  .screen .ok .w i { font-style: normal; opacity: 0; transform: translateY(8px); }
  .screen .ok .w i:nth-child(1) { animation: letter-1 var(--cycle) infinite; }
  .screen .ok .w i:nth-child(2) { animation: letter-2 var(--cycle) infinite; }
  .screen .ok .w i:nth-child(3) { animation: letter-3 var(--cycle) infinite; }
  .screen .ok .w i:nth-child(4) { animation: letter-4 var(--cycle) infinite; }

  /* ───────────────────────── scene keyframes — 5 s cycle, 1 s = 20 % ───────────────────────── */
  @keyframes belt {
    0%, 60%   { background-position: 0 0;     animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
    78%, 100% { background-position: 150px 0; }
  }
  /* hoist: 0.5 s lower, release, 1.6 s lift */
  @keyframes crane {
    0%, 10%    { transform: translateY(-240px); animation-timing-function: cubic-bezier(.4, 0, .15, 1); }
    28%, 32%   { transform: translateY(0);      animation-timing-function: cubic-bezier(.4, 0, .6, 1); }
    40%, 100%  { transform: translateY(-240px); }
  }
  /* PLAN, 0.7 s: descend until the nib touches the parcel, one stroke edge to edge, rise */
  @keyframes plan-head {
    0%, 14%   { transform: translate(-44px, 0);    animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
    17%       { transform: translate(-44px, 30px); animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    29%       { transform: translate(44px, 30px);  animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
    34%, 60%  { transform: translate(44px, 0);     animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    70%, 100% { transform: translate(-44px, 0); }
  }
  /* DEV, 1.0 s: wind-up, slam, hold, rise */
  @keyframes press-head {
    0%, 20%   { transform: translateY(0);    animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    23%       { transform: translateY(-6px); animation-timing-function: cubic-bezier(.11, 0, .5, 0); }
    25%, 28%  { transform: translateY(40px); animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    34%, 100% { transform: translateY(0); }
  }
  @keyframes press-rod {
    0%, 20%   { transform: scaleY(1);     animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    23%       { transform: scaleY(.875);  animation-timing-function: cubic-bezier(.11, 0, .5, 0); }
    25%, 28%  { transform: scaleY(1.833); animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    34%, 100% { transform: scaleY(1); }
  }
  /* REVIEW, 1.3 s: lens on, sweep there and back, lens off as the badge lands */
  @keyframes lens {
    0%, 26%   { background: #2b3137;    box-shadow: inset 0 0 0 2px var(--steel), 0 0 0 0 rgba(9,105,218,0); }
    27%, 41%  { background: var(--blue); box-shadow: inset 0 0 0 2px var(--steel), 0 0 12px 2px rgba(9,105,218,.6); }
    43%, 100% { background: #2b3137;    box-shadow: inset 0 0 0 2px var(--steel), 0 0 0 0 rgba(9,105,218,0); }
  }
  @keyframes beam {
    0%, 27%   { transform: translateX(-44px); opacity: 0; }
    28%       { transform: translateX(-44px); opacity: 1; animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    34%       { transform: translateX(44px);  opacity: 1; animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    40%       { transform: translateX(-44px); opacity: 1; }
    41%, 100% { transform: translateX(-44px); opacity: 0; }
  }
  /* LGTM, 1.6 s: evaluate (two blinks) → flash → green → check → letters → door; back to red at 4.1 s */
  @keyframes closed {
    0%, 32%   { opacity: 1;   transform: scale(1); }
    33%       { opacity: .15; transform: scale(1); }
    34%       { opacity: 1;   transform: scale(1); }
    35%       { opacity: .15; transform: scale(1); }
    36%, 39%  { opacity: 1;   transform: scale(1);  animation-timing-function: cubic-bezier(.32, 0, .67, 0); }
    40%, 92%  { opacity: 0;   transform: scale(.6); animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    94%, 100% { opacity: 1;   transform: scale(1); }
  }
  @keyframes disp {
    0%, 39%   { background-color: #16191d;      animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    40%       { background-color: #e6f7ea;      animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    43%, 82%  { background-color: var(--green); animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    94%, 100% { background-color: #16191d; }
  }
  @keyframes ok-check {
    0%, 40%   { opacity: 0; transform: scale(.3); animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); }
    47%, 82%  { opacity: 1; transform: scale(1); }
    86%, 100% { opacity: 0; transform: scale(.3); }
  }
  @keyframes letter-1 { 0%, 42% { opacity: 0; transform: translateY(8px); animation-timing-function: cubic-bezier(.22, 1, .36, 1); } 46%, 82% { opacity: 1; transform: translateY(0); } 86%, 100% { opacity: 0; transform: translateY(8px); } }
  @keyframes letter-2 { 0%, 43% { opacity: 0; transform: translateY(8px); animation-timing-function: cubic-bezier(.22, 1, .36, 1); } 47%, 82% { opacity: 1; transform: translateY(0); } 86%, 100% { opacity: 0; transform: translateY(8px); } }
  @keyframes letter-3 { 0%, 44% { opacity: 0; transform: translateY(8px); animation-timing-function: cubic-bezier(.22, 1, .36, 1); } 48%, 82% { opacity: 1; transform: translateY(0); } 86%, 100% { opacity: 0; transform: translateY(8px); } }
  @keyframes letter-4 { 0%, 45% { opacity: 0; transform: translateY(8px); animation-timing-function: cubic-bezier(.22, 1, .36, 1); } 49%, 82% { opacity: 1; transform: translateY(0); } 86%, 100% { opacity: 0; transform: translateY(8px); } }
  @keyframes screen-glow {
    0%, 39%   { box-shadow: 0 10px 22px -12px rgba(75,47,224,.55), 0 0 22px -2px rgba(207,34,46,.45); animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    44%, 82%  { box-shadow: 0 10px 22px -12px rgba(75,47,224,.55), 0 0 48px 4px rgba(31,136,61,.55); animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    94%, 100% { box-shadow: 0 10px 22px -12px rgba(75,47,224,.55), 0 0 22px -2px rgba(207,34,46,.45); }
  }
  @keyframes ring {
    0%, 39.9% { transform: scale(1); opacity: 0; }
    40%       { transform: scale(1); opacity: .6; animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    52%, 100% { transform: scale(1.45); opacity: 0; }
  }
  @keyframes door {
    0%, 44%   { transform: translateY(0);     background-color: var(--red);   animation-timing-function: cubic-bezier(.05, .7, .1, 1); }
    54%, 80%  { transform: translateY(-90px); background-color: var(--green); animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
    90%, 100% { transform: translateY(0);     background-color: var(--red); }
  }
  @keyframes mark-disp  { 0%, 44% { background-color: #16191d; } 48%, 82% { background-color: var(--green); } 92%, 100% { background-color: #16191d; } }
  @keyframes mark-check { 0%, 44% { stroke: #6e7681; } 48%, 82% { stroke: #fff; } 92%, 100% { stroke: #6e7681; } }
  @keyframes mark-glow {
    0%, 44%   { box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 10px 22px -12px rgba(75,47,224,.55), 0 0 0 0 rgba(31,136,61,0); }
    48%, 82%  { box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 10px 22px -12px rgba(75,47,224,.55), 0 0 28px 2px rgba(31,136,61,.35); }
    92%, 100% { box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 10px 22px -12px rgba(75,47,224,.55), 0 0 0 0 rgba(31,136,61,0); }
  }
  /* station labels light up while their tool works, in the same cascade */
  @keyframes lb-plan   { 0%, 13% { color: var(--label); } 14%, 33% { color: var(--ink-2); } 35%, 100% { color: var(--label); } }
  @keyframes lb-dev    { 0%, 19% { color: var(--label); } 20%, 33% { color: var(--ink-2); } 35%, 100% { color: var(--label); } }
  @keyframes lb-review { 0%, 25% { color: var(--label); } 26%, 43% { color: var(--ink-2); } 45%, 100% { color: var(--label); } }
  @keyframes lb-lgtm   { 0%, 31% { color: var(--label); } 32%, 41% { color: var(--ink-2); } 43%, 82% { color: var(--green-fg); } 86%, 100% { color: var(--label); } }

  /* ───────────────────────── parcel journey — 25 s, 1 s = 4 % ───────────────────────── */
  @keyframes journey {
    0%, 2%       { transform: translate(60px, -240px); animation-timing-function: cubic-bezier(.4, 0, .15, 1); }  /* lowered by the hoist */
    5.6%, 12%    { transform: translate(60px, 0);      animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
    15.6%, 32%   { transform: translate(210px, 0);     animation-timing-function: cubic-bezier(.2, 0, 0, 1); }   /* PLAN */
    35.6%, 52%   { transform: translate(360px, 0);     animation-timing-function: cubic-bezier(.2, 0, 0, 1); }   /* DEV */
    55.6%, 72%   { transform: translate(510px, 0);     animation-timing-function: cubic-bezier(.2, 0, 0, 1); }   /* REVIEW */
    75.6%, 92%   { transform: translate(660px, 0);     animation-timing-function: cubic-bezier(.2, 0, 0, 1); }   /* inside the gate unit */
    95.6%        { transform: translate(920px, 0);     animation-timing-function: step-end; }                    /* out through the open door */
    96%, 100%    { transform: translate(60px, -240px); }
  }
  @keyframes squash {
    0%, 5.4%       { transform: scale(1, 1); }
    5.6%           { transform: scale(1.03, .95); animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); }  /* landing */
    6.8%, 44.8%    { transform: scale(1, 1); }
    45.2%          { transform: scale(1.05, .9);  animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); }  /* press impact */
    47%, 88.4%     { transform: scale(1, 1); }
    89%            { transform: scale(1.04, 1.04); animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); } /* verdict pulse */
    90.4%, 100%    { transform: scale(1, 1); }
  }
  /* the plan band grows under the print head's nib, then turns green at the verdict */
  @keyframes band {
    0%, 23.4%    { transform: scaleX(0); background-color: var(--purple); animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    25.8%, 88.6% { transform: scaleX(1); background-color: var(--purple); animation-timing-function: cubic-bezier(.33, 1, .68, 1); }
    89.6%, 95.6% { transform: scaleX(1); background-color: var(--green);  animation-timing-function: step-end; }
    96%, 100%    { transform: scaleX(0); background-color: var(--purple); }
  }
  @keyframes ico-issue { 0%, 45%   { transform: scale(1); animation-timing-function: cubic-bezier(.32, 0, .67, 0); } 45.6%, 95.6% { transform: scale(0); animation-timing-function: step-end; } 96%, 100% { transform: scale(1); } }
  @keyframes ico-pr    { 0%, 45.2% { transform: scale(0); animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); } 46.4%, 95.6% { transform: scale(1); animation-timing-function: step-end; } 96%, 100% { transform: scale(0); } }
  @keyframes badge     { 0%, 68%   { transform: scale(0); animation-timing-function: cubic-bezier(.34, 1.56, .64, 1); } 69.2%, 95.6% { transform: scale(1); animation-timing-function: step-end; } 96%, 100% { transform: scale(0); } }

  /* reduced motion: hold the LGTM frame as a still */
  @media (prefers-reduced-motion: reduce) {
    .banner *, .banner *::before, .banner *::after { animation-play-state: paused !important; }
    .banner * { animation-delay: calc(var(--d, 0s) - 2.6s) !important; }
    .banner *::before, .banner *::after { animation-delay: -2.6s !important; }
    .playhead { display: none; }
  }

  /* ───────────────────────── mockup chrome (not part of the header) ───────────────────────── */
  .meta { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 4px 0; font: 500 12px/1.4 var(--sans); color: var(--label); }
  .timeline { position: relative; margin: 10px 4px 0; height: 26px; }
  .timeline .track { position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: var(--line); border-radius: 1px; }
  .timeline .playhead { position: absolute; left: 0; top: 0; width: 2px; height: 10px; background: var(--purple); border-radius: 1px; animation: playhead var(--cycle) linear infinite; }
  .timeline .beat { position: absolute; top: 12px; transform: translateX(-50%); font: 500 10px/1 var(--sans); color: var(--label); white-space: nowrap; }
  .timeline .beat::before { content: ""; position: absolute; left: 50%; top: -9px; width: 1px; height: 6px; background: var(--line); }
  @keyframes playhead { from { left: 0; } to { left: 100%; } }
</style>
</head>
<body>
<div class="stage">
  <div class="wrap">
  <div class="banner" role="img" aria-label="lgtmgate — GitHub issues move down an assembly line through plan, dev and review, then enter the gate unit whose screen turns green and reads LGTM before the door opens">

    <!-- brand -->
    <div class="brand">
      <div class="mark" aria-hidden="true"><div class="disp"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div></div>
      <div class="text">
        <div class="eyebrow">Claude Code plugin</div>
        <h1 class="title"><b>lgtm</b>gate</h1>
        <p class="tagline">Merge gate for agent-generated pull requests</p>
      </div>
    </div>

    <!-- the line -->
    <div class="line" aria-hidden="true">
      <div class="rail"></div>

      <div class="trolley"></div>
      <div class="crane"><div class="rig"><div class="cable"></div><div class="grip"></div></div></div>

      <div class="fx fx-plan"><div class="hanger"></div><div class="head"></div></div>
      <div class="fx fx-dev"><div class="rod"></div><div class="head"></div></div>
      <div class="fx fx-scan"><div class="hanger"></div><div class="body"></div><div class="lens"></div><div class="beam"></div></div>

      <div class="belt-shadow"></div>
      <div class="belt"></div>

      <!-- five parcels, one journey, staggered by one cycle each -->
      <div class="parcel" style="--d: 0s">
        <div class="body"><div class="band"></div><div class="glyph">
          <svg class="issue" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#1a7f37" stroke-width="1.8"/><circle cx="8" cy="8" r="1.7" fill="#1a7f37"/></svg>
          <svg class="pr" viewBox="0 0 16 16" fill="none" stroke="#1a7f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="3.5" r="1.9"/><circle cx="4" cy="12.5" r="1.9"/><circle cx="12" cy="12.5" r="1.9"/><path d="M4 5.4v5.2"/><path d="M8.6 3.5H10a2 2 0 0 1 2 2v5.1"/><path d="M7.2 1.6 8.9 3.5 7.2 5.4"/></svg>
        </div></div>
        <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      </div>
      <div class="parcel" style="--d: -5s">
        <div class="body"><div class="band"></div><div class="glyph">
          <svg class="issue" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#1a7f37" stroke-width="1.8"/><circle cx="8" cy="8" r="1.7" fill="#1a7f37"/></svg>
          <svg class="pr" viewBox="0 0 16 16" fill="none" stroke="#1a7f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="3.5" r="1.9"/><circle cx="4" cy="12.5" r="1.9"/><circle cx="12" cy="12.5" r="1.9"/><path d="M4 5.4v5.2"/><path d="M8.6 3.5H10a2 2 0 0 1 2 2v5.1"/><path d="M7.2 1.6 8.9 3.5 7.2 5.4"/></svg>
        </div></div>
        <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      </div>
      <div class="parcel" style="--d: -10s">
        <div class="body"><div class="band"></div><div class="glyph">
          <svg class="issue" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#1a7f37" stroke-width="1.8"/><circle cx="8" cy="8" r="1.7" fill="#1a7f37"/></svg>
          <svg class="pr" viewBox="0 0 16 16" fill="none" stroke="#1a7f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="3.5" r="1.9"/><circle cx="4" cy="12.5" r="1.9"/><circle cx="12" cy="12.5" r="1.9"/><path d="M4 5.4v5.2"/><path d="M8.6 3.5H10a2 2 0 0 1 2 2v5.1"/><path d="M7.2 1.6 8.9 3.5 7.2 5.4"/></svg>
        </div></div>
        <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      </div>
      <div class="parcel" style="--d: -15s">
        <div class="body"><div class="band"></div><div class="glyph">
          <svg class="issue" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#1a7f37" stroke-width="1.8"/><circle cx="8" cy="8" r="1.7" fill="#1a7f37"/></svg>
          <svg class="pr" viewBox="0 0 16 16" fill="none" stroke="#1a7f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="3.5" r="1.9"/><circle cx="4" cy="12.5" r="1.9"/><circle cx="12" cy="12.5" r="1.9"/><path d="M4 5.4v5.2"/><path d="M8.6 3.5H10a2 2 0 0 1 2 2v5.1"/><path d="M7.2 1.6 8.9 3.5 7.2 5.4"/></svg>
        </div></div>
        <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      </div>
      <div class="parcel" style="--d: -20s">
        <div class="body"><div class="band"></div><div class="glyph">
          <svg class="issue" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#1a7f37" stroke-width="1.8"/><circle cx="8" cy="8" r="1.7" fill="#1a7f37"/></svg>
          <svg class="pr" viewBox="0 0 16 16" fill="none" stroke="#1a7f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="3.5" r="1.9"/><circle cx="4" cy="12.5" r="1.9"/><circle cx="12" cy="12.5" r="1.9"/><path d="M4 5.4v5.2"/><path d="M8.6 3.5H10a2 2 0 0 1 2 2v5.1"/><path d="M7.2 1.6 8.9 3.5 7.2 5.4"/></svg>
        </div></div>
        <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      </div>

      <div class="gate">
        <div class="post l"></div><div class="post r"></div>
        <div class="beam"></div>
        <div class="housing"></div>
        <div class="door"></div>
        <div class="screen">
          <div class="disp">
            <div class="closed"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11"/><line x1="9.5" y1="15" x2="20.5" y2="15"/></svg></div>
            <div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span class="w"><i>L</i><i>G</i><i>T</i><i>M</i></span></div>
          </div>
        </div>
      </div>

      <div class="lb lb-plan">Plan</div>
      <div class="lb lb-dev">Dev</div>
      <div class="lb lb-review">Review</div>
      <div class="lb lb-lgtm">LGTM</div>
    </div>
  </div>
  </div>

  <!-- mockup chrome: helps reviewing the loop; not part of the header itself -->
  <div class="meta"><span>README header mockup · 1280 × 320 · light</span><span>CSS keyframes only · scene loops every 5 s · each parcel travels 25 s</span></div>
  <div class="timeline">
    <div class="track"></div><div class="playhead"></div>
    <div class="beat" style="left:10%">hoist</div>
    <div class="beat" style="left:14%">plan</div>
    <div class="beat" style="left:20%">dev</div>
    <div class="beat" style="left:26%">review</div>
    <div class="beat" style="left:32%">evaluate</div>
    <div class="beat" style="left:40%">green</div>
    <div class="beat" style="left:60%">index</div>
    <div class="beat" style="left:80%">close</div>
  </div>
</div>
</body>
</html>
