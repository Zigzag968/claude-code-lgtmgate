<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lgtmgate header mockup</title>
<style>
  :root { --page: #EEF0F3; --ink: #111318; --muted: #5B6472; }
  html, body { margin: 0; background: var(--page); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 40px 16px 56px; }
  .frame { border-radius: 20px; overflow: hidden; box-shadow: 0 1px 0 rgba(17,19,24,.04), 0 12px 40px -12px rgba(17,19,24,.18); }
  .frame svg { display: block; width: 100%; height: auto; }
  p.note { font-size: 13px; color: var(--muted); margin: 14px 4px 0; }
</style>
</head>
<body>
<main>
<div class="frame">
<!--
  The whole banner is ONE self-contained <svg> with its own <style>.
  It can be extracted verbatim to docs/banner-light.svg: GitHub renders README
  images through <img>, where CSS @keyframes inside an SVG still play, but where
  HTML/JS would not. No external fonts, no scripts, no raster.
-->
<svg viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="lgtmgate: a GitHub issue travels an assembly line (plan, dev, review) and passes the LGTM gate as a merge-ready pull request">
<style>
  /* ---------- motion tokens ---------- */
  /* One 10 s master clock: every part is keyed to the same timeline, like
     machines on one line. Percentages below are 100 ms each.              */
  .a { animation-duration: 10s; animation-iteration-count: infinite; animation-fill-mode: both; }

  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

  /* ---------- the parcel ---------- */
  .pkg-fade   { animation-name: pkgFade; }
  .pkg-move   { animation-name: pkgMove; }
  .pkg-squash { animation-name: pkgSquash; }
  .belt-ticks { animation-name: beltMove; }

  /* Indexed conveyor: the parcel moves station to station with a strong
     in-out (0.77,0,0.175,1), then dwells. Belt shares the exact same curve. */
  @keyframes pkgMove {
    0%    { transform: translate(0px,-110px); animation-timing-function: cubic-bezier(.45,0,.2,1); }
    2%    { transform: translate(0px,-110px); animation-timing-function: cubic-bezier(.55,0,.85,.55); }
    9%    { transform: translate(0px,0px); }
    12%   { transform: translate(0px,0px);   animation-timing-function: cubic-bezier(.77,0,.175,1); }
    18%   { transform: translate(145px,0px); }
    28%   { transform: translate(145px,0px); animation-timing-function: cubic-bezier(.77,0,.175,1); }
    34%   { transform: translate(290px,0px); }
    44%   { transform: translate(290px,0px); animation-timing-function: cubic-bezier(.77,0,.175,1); }
    50%   { transform: translate(435px,0px); }
    61%   { transform: translate(435px,0px); animation-timing-function: cubic-bezier(.77,0,.175,1); }
    67%   { transform: translate(580px,0px); }
    75%   { transform: translate(580px,0px); animation-timing-function: cubic-bezier(.23,1,.32,1); }
    76%   { transform: translate(574px,0px); animation-timing-function: cubic-bezier(.5,0,.75,0); }
    86%   { transform: translate(850px,0px); }
    95%   { transform: translate(850px,0px); }
    95.1% { transform: translate(0px,-110px); }
    100%  { transform: translate(0px,-110px); }
  }
  @keyframes beltMove {
    0%    { stroke-dashoffset: 0; }
    12%   { stroke-dashoffset: 0;    animation-timing-function: cubic-bezier(.77,0,.175,1); }
    18%   { stroke-dashoffset: -145; }
    28%   { stroke-dashoffset: -145; animation-timing-function: cubic-bezier(.77,0,.175,1); }
    34%   { stroke-dashoffset: -290; }
    44%   { stroke-dashoffset: -290; animation-timing-function: cubic-bezier(.77,0,.175,1); }
    50%   { stroke-dashoffset: -435; }
    61%   { stroke-dashoffset: -435; animation-timing-function: cubic-bezier(.77,0,.175,1); }
    67%   { stroke-dashoffset: -580; }
    75%   { stroke-dashoffset: -580; animation-timing-function: cubic-bezier(.23,1,.32,1); }
    76%   { stroke-dashoffset: -574; animation-timing-function: cubic-bezier(.5,0,.75,0); }
    86%   { stroke-dashoffset: -850; }
    95%   { stroke-dashoffset: -850; }
    95.1% { stroke-dashoffset: 0; }
    100%  { stroke-dashoffset: 0; }
  }
  @keyframes pkgFade {
    0%, 80% { opacity: 1; }
    86%, 96% { opacity: 0; }
    99.5%, 100% { opacity: 1; }
  }
  /* Squash and stretch kept inside the 0.86–1.07 range: weight, not rubber. */
  @keyframes pkgSquash {
    0%, 8.8% { transform: scale(1,1); }
    9.6%  { transform: scale(1.06,.9);  animation-timing-function: cubic-bezier(.23,1,.32,1); }
    11%   { transform: scale(.98,1.03); }
    12.5%, 37.5% { transform: scale(1,1); }
    38.2% { transform: scale(1.07,.86); animation-timing-function: cubic-bezier(.23,1,.32,1); }
    39.8% { transform: scale(.98,1.03); }
    41.5%, 100% { transform: scale(1,1); }
  }

  /* hoist */
  .cable { animation-name: cable; }
  .hook  { animation-name: hook; }
  @keyframes cable {
    0%, 2%  { transform: scaleY(.203); animation-timing-function: cubic-bezier(.55,0,.85,.55); }
    9%, 11% { transform: scaleY(1);    animation-timing-function: cubic-bezier(.23,1,.32,1); }
    16%, 100% { transform: scaleY(.203); }
  }
  @keyframes hook {
    0%, 2%  { transform: translateY(28px);  animation-timing-function: cubic-bezier(.55,0,.85,.55); }
    9%, 11% { transform: translateY(138px); animation-timing-function: cubic-bezier(.23,1,.32,1); }
    16%, 100% { transform: translateY(28px); }
  }

  /* label printed by PLAN, stamped by DEV, ticked by REVIEW */
  .row1 { animation-name: row1; } .row2 { animation-name: row2; } .row3 { animation-name: row3; }
  @keyframes row1 { 0%, 20% { transform: scaleX(0); opacity: 0; animation-timing-function: cubic-bezier(.23,1,.32,1); } 21.8%, 94% { transform: scaleX(1); opacity: 1; } 94.1%, 100% { transform: scaleX(0); opacity: 0; } }
  @keyframes row2 { 0%, 22.4% { transform: scaleX(0); opacity: 0; animation-timing-function: cubic-bezier(.23,1,.32,1); } 24.2%, 94% { transform: scaleX(1); opacity: 1; } 94.1%, 100% { transform: scaleX(0); opacity: 0; } }
  @keyframes row3 { 0%, 24.8% { transform: scaleX(0); opacity: 0; animation-timing-function: cubic-bezier(.23,1,.32,1); } 26.6%, 94% { transform: scaleX(1); opacity: 1; } 94.1%, 100% { transform: scaleX(0); opacity: 0; } }

  .tick1 { animation-name: tick1; } .tick2 { animation-name: tick2; } .tick3 { animation-name: tick3; }
  @keyframes tick1 { 0%, 52.6% { stroke-dashoffset: 14; animation-timing-function: cubic-bezier(.23,1,.32,1); } 53.6%, 94% { stroke-dashoffset: 0; } 94.1%, 100% { stroke-dashoffset: 14; } }
  @keyframes tick2 { 0%, 55.1% { stroke-dashoffset: 14; animation-timing-function: cubic-bezier(.23,1,.32,1); } 56.1%, 94% { stroke-dashoffset: 0; } 94.1%, 100% { stroke-dashoffset: 14; } }
  @keyframes tick3 { 0%, 57.6% { stroke-dashoffset: 14; animation-timing-function: cubic-bezier(.23,1,.32,1); } 58.6%, 94% { stroke-dashoffset: 0; } 94.1%, 100% { stroke-dashoffset: 14; } }

  .stamp { animation-name: stamp; }
  @keyframes stamp {
    0%, 37.4% { opacity: 0; transform: scale(1.4); }
    37.5% { opacity: 1; transform: scale(1.4); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
    39.2%, 94% { opacity: 1; transform: scale(1); }
    94.1%, 100% { opacity: 0; transform: scale(1.4); }
  }

  /* ---------- station 01 · PLAN : scanner ---------- */
  .fan  { animation-name: fan; }
  .scan { animation-name: scan; }
  .emit { animation-name: emit; }
  @keyframes fan  { 0%, 18% { opacity: 0; } 19.5%, 26.5% { opacity: 1; } 28%, 100% { opacity: 0; } }
  @keyframes emit { 0%, 18% { fill: #C9CCD6; } 19%, 27% { fill: #7C5CFF; } 28%, 100% { fill: #C9CCD6; } }
  @keyframes scan {
    0%, 18.9% { transform: translateY(0); opacity: 0; }
    19%   { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(.65,0,.35,1); }
    23%   { transform: translateY(58px); animation-timing-function: cubic-bezier(.65,0,.35,1); }
    27%   { transform: translateY(0); opacity: 1; }
    27.8%, 100% { transform: translateY(0); opacity: 0; }
  }

  /* ---------- station 02 · DEV : press ---------- */
  .press { animation-name: press; }
  .spark { animation-name: spark; }
  /* Anticipation (lift 7px, ease-out) → slam (ease-in: accelerates INTO the
     hit) → dwell → return (ease-out). The one place ease-in is right.     */
  @keyframes press {
    0%, 34% { transform: translateY(0); animation-timing-function: cubic-bezier(.23,1,.32,1); }
    35.8% { transform: translateY(-7px); animation-timing-function: cubic-bezier(.7,0,1,.6); }
    37.5% { transform: translateY(24px); }
    38.8% { transform: translateY(24px); animation-timing-function: cubic-bezier(.23,1,.32,1); }
    42.5%, 100% { transform: translateY(0); }
  }
  @keyframes spark {
    0%, 37.4% { opacity: 0; transform: scale(.5); }
    37.8% { opacity: 1; transform: scale(.8); animation-timing-function: cubic-bezier(.23,1,.32,1); }
    40.2%, 100% { opacity: 0; transform: scale(1.35); }
  }

  /* ---------- station 03 · REVIEW : the reading lens ---------- */
  .lens { animation-name: lens; }
  /* The lens READS: left→right on each checklist line, a tick lands at the
     end of each line. Evidence first, verdict after.                      */
  @keyframes lens {
    0%, 50% { transform: translate(-6px,158px); animation-timing-function: cubic-bezier(.23,1,.32,1); }
    51.5% { transform: translate(-18px,212px); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    53%   { transform: translate(8px,212px);   animation-timing-function: cubic-bezier(.65,0,.35,1); }
    54%   { transform: translate(-18px,220px); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    55.5% { transform: translate(8px,220px);   animation-timing-function: cubic-bezier(.65,0,.35,1); }
    56.5% { transform: translate(-18px,228px); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    58%   { transform: translate(8px,228px);   animation-timing-function: cubic-bezier(.65,0,.35,1); }
    60.5%, 100% { transform: translate(-6px,158px); }
  }

  /* ---------- station 04 · LGTM : the gate ---------- */
  .bar      { animation-name: bar; }
  .lamp-red { animation-name: lampRed; }
  .lamp-grn { animation-name: lampGrn; }
  .glow-grn { animation-name: glowGrn; }
  @keyframes bar {
    0%, 72% { transform: translateY(0); animation-timing-function: cubic-bezier(.23,1,.32,1); }
    75.5%, 90% { transform: translateY(-106px); animation-timing-function: cubic-bezier(.65,0,.35,1); }
    93%, 100% { transform: translateY(0); }
  }
  /* Red holds, blinks twice (tension), then hands over to green. */
  @keyframes lampRed {
    0%, 66.9% { opacity: 1; }
    67.8% { opacity: .22; } 68.7% { opacity: 1; } 69.6% { opacity: .22; } 70.5% { opacity: 1; }
    71.1%, 93% { opacity: 0; }
    94%, 100% { opacity: 1; }
  }
  @keyframes lampGrn { 0%, 70.9% { opacity: 0; } 71.3%, 92.5% { opacity: 1; } 93.5%, 100% { opacity: 0; } }
  @keyframes glowGrn {
    0%, 71% { opacity: 0; transform: scale(.5); animation-timing-function: cubic-bezier(.23,1,.32,1); }
    72.6% { opacity: 1; transform: scale(1.2); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    76%, 92.5% { opacity: .55; transform: scale(1); }
    93.5%, 100% { opacity: 0; transform: scale(.8); }
  }

  /* ---------- the mark: an andon screen ---------- */
  .dots      { animation-name: dots; }
  .dot1      { animation-name: dot1; } .dot2 { animation-name: dot2; } .dot3 { animation-name: dot3; }
  .dots-red  { animation-name: dotsRed; }
  .ok        { animation-name: ok; }
  .ok-check  { animation-name: okCheck; }
  .ok-text   { animation-name: okText; }
  .ok-glow   { animation-name: okGlow; }
  .halo      { animation-name: halo; }
  /* Split-flap spirit: the "waiting" face folds shut (ease-in), the LGTM face
     unfolds with an overshoot (easeOutBack 0.34,1.56,0.64,1), then the check
     draws itself. Three beats, ~300 ms apart: fold · open · sign.          */
  @keyframes dots {
    0%, 70.6% { transform: scaleY(1); animation-timing-function: cubic-bezier(.55,0,1,.45); }
    71.3%, 94% { transform: scaleY(.02); animation-timing-function: cubic-bezier(.23,1,.32,1); }
    96%, 100% { transform: scaleY(1); }
  }
  @keyframes dot1 { 0%, 27.9% { opacity: 0; transform: scale(.4); animation-timing-function: cubic-bezier(.34,1.56,.64,1); } 29.5%, 92% { opacity: 1; transform: scale(1); } 92.1%, 100% { opacity: 0; } }
  @keyframes dot2 { 0%, 43.9% { opacity: 0; transform: scale(.4); animation-timing-function: cubic-bezier(.34,1.56,.64,1); } 45.5%, 92% { opacity: 1; transform: scale(1); } 92.1%, 100% { opacity: 0; } }
  @keyframes dot3 { 0%, 60.9% { opacity: 0; transform: scale(.4); animation-timing-function: cubic-bezier(.34,1.56,.64,1); } 62.5%, 92% { opacity: 1; transform: scale(1); } 92.1%, 100% { opacity: 0; } }
  @keyframes dotsRed {
    0%, 66.9% { opacity: 0; }
    67.2% { opacity: 1; } 67.8% { opacity: .25; } 68.7% { opacity: 1; } 69.6% { opacity: .25; } 70.5% { opacity: 1; }
    71.4%, 92% { opacity: 1; }
    92.1%, 100% { opacity: 0; }
  }
  @keyframes ok {
    0%, 71.2% { transform: scaleY(.02); opacity: 0; }
    71.3% { transform: scaleY(.02); opacity: 1; animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
    72.5%, 92.5% { transform: scaleY(1); opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); }
    93.8% { transform: scaleY(.02); opacity: 1; }
    93.9%, 100% { transform: scaleY(.02); opacity: 0; }
  }
  @keyframes okCheck { 0%, 71.7% { stroke-dashoffset: 48; animation-timing-function: cubic-bezier(.23,1,.32,1); } 73.8%, 93.9% { stroke-dashoffset: 0; } 94%, 100% { stroke-dashoffset: 48; } }
  @keyframes okText  { 0%, 72.6% { opacity: 0; transform: translateY(4px); animation-timing-function: cubic-bezier(.23,1,.32,1); } 74.4%, 93.9% { opacity: 1; transform: translateY(0); } 94%, 100% { opacity: 0; } }
  @keyframes okGlow  { 0%, 71.3% { opacity: 0; } 72.6% { opacity: 1; } 76%, 92.5% { opacity: .6; } 93.8%, 100% { opacity: 0; } }
  @keyframes halo {
    0%, 71.3% { opacity: 0; transform: scale(1); }
    71.4% { opacity: .75; transform: scale(1); animation-timing-function: cubic-bezier(.23,1,.32,1); }
    78%, 100% { opacity: 0; transform: scale(1.45); }
  }

  /* ---------- station labels ---------- */
  .lbl-issue  { animation-name: lblIssue; }
  .lbl-plan   { animation-name: lblPlan; }
  .lbl-dev    { animation-name: lblDev; }
  .lbl-review { animation-name: lblReview; }
  .lbl-lgtm   { animation-name: lblLgtm; }
  .pip-plan   { animation-name: pipPlan; } .pip-dev { animation-name: pipDev; } .pip-review { animation-name: pipReview; }
  .pip-issue  { animation-name: pipIssue; }
  @keyframes lblIssue  { 0%, 12% { fill: #111318; } 13%, 96% { fill: #A3A9B4; } 97%, 100% { fill: #111318; } }
  @keyframes lblPlan   { 0%, 17.5% { fill: #A3A9B4; } 18.5%, 28% { fill: #111318; } 29%, 100% { fill: #A3A9B4; } }
  @keyframes lblDev    { 0%, 33.5% { fill: #A3A9B4; } 34.5%, 44% { fill: #111318; } 45%, 100% { fill: #A3A9B4; } }
  @keyframes lblReview { 0%, 49.5% { fill: #A3A9B4; } 50.5%, 61% { fill: #111318; } 62%, 100% { fill: #A3A9B4; } }
  @keyframes lblLgtm   { 0%, 66.5% { fill: #A3A9B4; } 67.5%, 71% { fill: #D93B41; } 71.5%, 92.5% { fill: #16A34A; } 93.5%, 100% { fill: #A3A9B4; } }
  @keyframes pipIssue  { 0%, 12% { opacity: 1; } 13%, 96% { opacity: 0; } 97%, 100% { opacity: 1; } }
  @keyframes pipPlan   { 0%, 17.5% { opacity: 0; } 18.5%, 28% { opacity: 1; } 29%, 100% { opacity: 0; } }
  @keyframes pipDev    { 0%, 33.5% { opacity: 0; } 34.5%, 44% { opacity: 1; } 45%, 100% { opacity: 0; } }
  @keyframes pipReview { 0%, 49.5% { opacity: 0; } 50.5%, 61% { opacity: 1; } 62%, 100% { opacity: 0; } }

  /* ---------- accessibility: a calm, finished still ---------- */
  @media (prefers-reduced-motion: reduce) {
    .a { animation: none !important; }
    .pkg-move { transform: translate(580px,0px); }
    .cable { transform: scaleY(.203); } .hook { transform: translateY(28px); }
    .row1, .row2, .row3, .stamp { opacity: 1; transform: none; }
    .tick1, .tick2, .tick3, .ok-check { stroke-dashoffset: 0; }
    .scan, .fan, .spark, .dots-red, .halo { opacity: 0; }
    .lens { transform: translate(-6px,158px); }
    .bar { transform: translateY(-106px); }
    .lamp-red { opacity: 0; } .lamp-grn, .ok, .ok-text { opacity: 1; } .glow-grn, .ok-glow { opacity: .6; }
    .dots { transform: scaleY(.02); } .ok { transform: none; }
    .dot1, .dot2, .dot3 { opacity: 0; }
    .lbl-lgtm { fill: #16A34A; } .lbl-issue { fill: #A3A9B4; }
    .pip-issue, .pip-plan, .pip-dev, .pip-review { opacity: 0; }
  }
</style>

<defs>
  <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#E3E5E9"/>
  </pattern>
  <radialGradient id="gridFade" cx="72%" cy="55%" r="70%">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridMask"><rect width="1280" height="320" fill="url(#gridFade)"/></mask>

  <linearGradient id="edgeFade" x1="0" x2="1">
    <stop offset="0" stop-color="#FBFBFA" stop-opacity="0"/>
    <stop offset="1" stop-color="#FBFBFA" stop-opacity="1"/>
  </linearGradient>

  <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2C3039"/>
    <stop offset="1" stop-color="#17191F"/>
  </linearGradient>
  <radialGradient id="screenGreen" cx="50%" cy="45%" r="60%">
    <stop offset="0" stop-color="#22C55E" stop-opacity=".38"/>
    <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lampGlowG">
    <stop offset="0" stop-color="#22C55E" stop-opacity=".45"/>
    <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lampGlowR">
    <stop offset="0" stop-color="#EF4444" stop-opacity=".5"/>
    <stop offset="1" stop-color="#EF4444" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fanGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7C5CFF" stop-opacity=".30"/>
    <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="kraft" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EDDCBD"/>
    <stop offset="1" stop-color="#E2CCA5"/>
  </linearGradient>
  <pattern id="hazard" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#E5484D"/>
    <rect width="3.5" height="8" fill="#FFFFFF"/>
  </pattern>

  <!-- everything hanging from a beam is clipped just below it -->
  <clipPath id="underBeam"><rect x="0" y="134" width="1280" height="186"/></clipPath>
</defs>

<!-- ============ canvas ============ -->
<rect width="1280" height="320" fill="#FBFBFA"/>
<rect width="1280" height="320" fill="url(#grid)" mask="url(#gridMask)"/>

<!-- ============ brand block ============ -->
<!-- The mark: a factory andon screen. Its resting, canonical face is the
     green check + LGTM; during the loop it is the line's status display. -->
<g transform="translate(48,112)">
  <!-- halo pulse on the flip -->
  <g transform="translate(48,48)">
    <rect class="a halo" x="-48" y="-48" width="96" height="96" rx="24" fill="none" stroke="#22C55E" stroke-width="2"/>
  </g>
  <rect width="96" height="96" rx="24" fill="url(#housing)"/>
  <rect x=".5" y=".5" width="95" height="95" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
  <!-- four screws: the one detail that says "panel", not "app icon" -->
  <g fill="#434956"><circle cx="10" cy="10" r="1.8"/><circle cx="86" cy="10" r="1.8"/><circle cx="10" cy="86" r="1.8"/><circle cx="86" cy="86" r="1.8"/></g>
  <rect x="14" y="14" width="68" height="68" rx="13" fill="#0A0C10"/>
  <rect class="a ok-glow" x="14" y="14" width="68" height="68" rx="13" fill="url(#screenGreen)"/>

  <!-- face A: progress, one pip per station -->
  <g transform="translate(48,48)">
    <g class="a dots">
      <g fill="#2E333D"><circle cx="-21" r="3.6"/><circle cx="-7" r="3.6"/><circle cx="7" r="3.6"/><circle cx="21" r="3.6"/></g>
      <g transform="translate(-21,0)"><circle class="a dot1" r="3.6" fill="#D9DCE3"/></g>
      <g transform="translate(-7,0)"><circle class="a dot2" r="3.6" fill="#D9DCE3"/></g>
      <g transform="translate(7,0)"><circle class="a dot3" r="3.6" fill="#D9DCE3"/></g>
      <g class="a dots-red" fill="#F0474D"><circle cx="-21" r="3.6"/><circle cx="-7" r="3.6"/><circle cx="7" r="3.6"/><circle cx="21" r="3.6"/></g>
    </g>
  </g>

  <!-- face B: the verdict -->
